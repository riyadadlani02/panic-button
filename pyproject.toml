[project]
name = "panic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography",
    "argon2-cffi",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "msal>=1.39.0",
]

[project.scripts]
panic = "panic.cli:main"

[dependency-groups]
dev = ["pytest"]
app = ["pywebview>=6,<7", "keyring>=25,<26", "pyinstaller>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panic"]
